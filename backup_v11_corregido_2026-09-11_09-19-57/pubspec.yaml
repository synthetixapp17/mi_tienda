name: sinthetix_pro
description: SINTHETIX PRO - Sistema de Punto de Venta Offline
publish_to: "none"

version: 7.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── BASE DE DATOS SQLITE ───
  sqflite: ^2.3.0
  sqflite_common_ffi_web: 1.1.2
  path: ^1.9.0
  path_provider: ^2.1.4

  # ─── INTERFAZ / NAVEGACIÓN ───
  cupertino_icons: ^1.0.8
  curved_labeled_navigation_bar: ^2.0.3

  # ─── ESCÁNER / IMÁGENES ───
  image_picker: ^1.1.2

  # ─── IMPRESIÓN / PDF ───
  printing: ^5.13.2
  pdf: ^3.11.1

  # ─── GRÁFICOS / QR / CÓDIGOS ───
  fl_chart: ^0.66.0
  qr_flutter: ^4.1.0
  barcode: ^2.2.6

  # ─── VOZ ───
  speech_to_text: ^6.6.0

  # ─── ARCHIVOS / COMPARTIR ───
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # ─── UTILIDADES ───
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  mobile_scanner: 6.0.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
