<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>SINTHETIX PRO · Tienda</title><style>
:root{--bg:#080b10;--surface:#10151c;--surface2:#151b23;--line:#252d38;--text:#f5f7fa;--muted:#8c97a7;--gold:#f0b90b;--green:#20c997}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070a0e,#0d1218 45%,#080b10);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:18px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 0 18px;position:sticky;top:0;background:rgba(8,11,16,.88);backdrop-filter:blur(16px);z-index:20}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:46px;height:46px;border-radius:15px;background:#171d26;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:900;color:var(--gold)}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font-size:17px;margin:0;font-weight:900}.brand p{font-size:10px;color:var(--muted);margin:3px 0 0}.actions{display:flex;gap:8px}.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px}.hero{border-radius:28px;overflow:hidden;min-height:235px;background:linear-gradient(135deg,#f0b90b,#f8d33a);position:relative;display:flex;align-items:flex-end;margin-bottom:18px;background-size:cover;background-position:center}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.08))}.heroText{position:relative;z-index:2;padding:30px;max-width:720px}.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:900;color:#fff8d8}.hero h2{font-size:clamp(30px,5vw,58px);line-height:.98;margin:8px 0 10px;font-weight:950}.hero p{margin:0;color:#fff8df;font-size:14px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:10px 15px;border-radius:999px;font-weight:800;font-size:11px}.chip.active{background:var(--gold);color:#101010;border-color:var(--gold)}.toolbar{display:flex;gap:9px;margin-bottom:18px}.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px 15px;color:var(--text);outline:none}.search:focus{border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:.2s;position:relative}.card:hover{transform:translateY(-2px);border-color:#3a4452}.pic{height:230px;background:#171d26;position:relative;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:10px;left:10px;background:rgba(8,11,16,.78);padding:7px 9px;border-radius:10px;font-size:9px;font-weight:900}.heart{position:absolute;top:9px;right:9px;width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(8,11,16,.72);color:#fff;font-size:18px}.heart.on{color:#ffcf3a}.info{padding:13px}.name{font-size:13px;font-weight:900;margin:0 0 5px;min-height:32px}.meta{color:var(--muted);font-size:9px;min-height:16px}.price{font-size:20px;color:var(--gold);font-weight:950;margin-top:8px}.buy{width:100%;border:0;background:var(--gold);color:#111;border-radius:13px;padding:11px;margin-top:11px;font-weight:950}.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:22px;background:var(--surface)}.float{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:0;background:#20c997;color:#06120e;font-size:25px;box-shadow:0 12px 35px rgba(0,0,0,.35);z-index:30}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:40}.drawer.open{display:flex}.sheet{width:100%;max-height:82vh;background:#10151c;border-top:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px;overflow:auto}.sheet h3{margin:0 0 14px}.cartrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.cartrow img{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#171d26}.cartrow .grow{flex:1}.qty{display:flex;align-items:center;gap:10px;margin-top:7px}.qty button{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--gold)}.checkout{width:100%;border:0;background:var(--gold);color:#111;border-radius:14px;padding:14px;font-weight:950;margin-top:14px}.loading{padding:50px;text-align:center;color:var(--muted)}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pic{height:205px}}@media(max-width:680px){.wrap{padding:12px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pic{height:175px}.hero{min-height:210px}.heroText{padding:22px}.hero h2{font-size:34px}.brand p{display:none}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo" id="logo">S</div><div><h1 id="storeName">SINTHETIX PRO</h1><p id="storeDesc">Tienda online</p></div></div><div class="actions"><button class="iconbtn" onclick="shareStore()">↗</button><button class="iconbtn" onclick="openCart()">🛒</button></div></header><section class="hero" id="hero"><div class="heroText"><div class="eyebrow">TIENDA ONLINE</div><h2 id="heroTitle">Descubre nuestros productos</h2><p id="heroSub">Compra fácil y consulta por WhatsApp.</p></div></section><div class="toolbar"><input id="search" class="search" placeholder="Buscar producto, código o marca…" oninput="renderProducts()"></div><div id="chips" class="chips"></div><div id="content" class="loading">Cargando catálogo…</div></main><button class="float" onclick="whatsapp()">◔</button><div id="drawer" class="drawer" onclick="if(event.target.id==='drawer')closeCart()"><section class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Tu carrito</h3><button class="iconbtn" onclick="closeCart()">×</button></div><div id="cart"></div><div id="cartTotal" style="font-size:22px;font-weight:950;color:#f0b90b;margin-top:14px"></div><button class="checkout" onclick="sendOrder()">Enviar pedido por WhatsApp</button></section></div><script>
const SUPA={"url": "https://euujrzmhhzikwwwmxgep.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1d2pyem1oaHppa3d3d214Z2VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0ODIxOTcsImV4cCI6MjEwNTA1ODE5N30.VWMnbhdcmoO6g_QkY019essMUlrYbhJP0TPjKznTJ4A"};let products=[],categories=[],banners=[],config={},cart=[],cat='Todas';const headers={'apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key};
async function api(path){const r=await fetch(SUPA.url+'/rest/v1/'+path,{headers});if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){try{[config,categories,products,banners]=await Promise.all([api('store_config?select=*&active=eq.true&limit=1'),api('store_categories?select=*&active=eq.true&order=sort_order.asc'),api('store_products?select=*&active=eq.true&order=created_at.desc'),api('store_banners?select=*&active=eq.true&order=sort_order.asc')]);config=config[0]||{};applyConfig();renderChips();renderProducts();rotateBanners()}catch(e){document.getElementById('content').innerHTML='<div class="empty"><b>No hay catálogo publicado todavía.</b><br><br>La tienda está lista. Cuando el POS sincronice productos con la nube aparecerán aquí.</div>';console.error(e)}}
function applyConfig(){document.title=(config.store_name||'SINTHETIX PRO')+' · Tienda';document.getElementById('storeName').textContent=config.store_name||'SINTHETIX PRO';document.getElementById('storeDesc').textContent=config.description||'Tienda online';if(config.logo_url)document.getElementById('logo').innerHTML='<img src="'+esc(config.logo_url)+'">';if(config.whatsapp)document.body.dataset.whatsapp=config.whatsapp}
function selectCat(n){cat=n;renderChips();renderProducts()}
function renderChips(){let names=['Todas',...categories.map(c=>c.name)];document.getElementById('chips').innerHTML=names.map(n=>'<button class="chip '+(n===cat?'active':'')+'" data-cat="'+esc(n)+'" onclick="selectCat(this.dataset.cat)">'+esc(n)+'</button>').join('')}
function img(p){return p.image_url||p.imagen_url||p.image_base64||p.imagen_base64||''}
function renderProducts(){let q=document.getElementById('search').value.trim().toLowerCase();let list=products.filter(p=>(cat==='Todas'||String(p.category_id||'')===String(categories.find(c=>c.name===cat)?.id||'')||String(p.categoria||'')===cat)&&(!q||String(p.name||p.nombre||'').toLowerCase().includes(q)||String(p.sku||'').toLowerCase().includes(q)||String(p.barcode||p.codigo_barras||'').includes(q)));if(!list.length){document.getElementById('content').innerHTML='<div class="empty">No hay productos para mostrar.</div>';return}document.getElementById('content').className='grid';document.getElementById('content').innerHTML=list.map(p=>card(p)).join('')}
function card(p){let id=p.id||p.local_id;let name=p.name||p.nombre||'Producto';let price=Number(p.price??p.precio??0);let im=img(p);let fav=localStorage.getItem('fav_'+id)==='1';return '<article class="card"><div class="pic">'+(im?'<img loading="lazy" src="'+esc(im)+'">':'<div style="height:100%;display:grid;place-items:center;color:#8c97a7;font-size:42px">□</div>')+'<div class="badge">'+esc(p.brand||p.marca||p.categoria||'General')+'</div><button class="heart '+(fav?'on':'')+'" data-id="'+escAttr(id)+'" onclick="toggleFav(this.dataset.id,this)">'+(fav?'♥':'♡')+'</button></div><div class="info"><p class="name">'+esc(name)+'</p><div class="meta">'+esc(p.sku||p.barcode||p.codigo_barras||'')+'</div><div class="price">$ '+price.toFixed(2)+'</div><button class="buy" data-id="'+escAttr(id)+'" onclick="add(this.dataset.id)">Agregar al carrito</button></div></article>'}
function toggleFav(id,b){let on=localStorage.getItem('fav_'+id)==='1';localStorage.setItem('fav_'+id,on?'0':'1');b.classList.toggle('on',!on);b.textContent=!on?'♥':'♡'}function add(id){let p=products.find(x=>String(x.id||x.local_id)===String(id));if(!p)return;let x=cart.find(x=>String(x.id)===String(id));if(x)x.qty++;else cart.push({id,p,qty:1});openCart()}function openCart(){renderCart();document.getElementById('drawer').classList.add('open')}function closeCart(){document.getElementById('drawer').classList.remove('open')}
function renderCart(){let el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="empty">Tu carrito está vacío.</div>';document.getElementById('cartTotal').textContent='';return}let total=0;el.innerHTML=cart.map(x=>{let p=x.p;let price=Number(p.price??p.precio??0);total+=price*x.qty;let im=img(p);return '<div class="cartrow">'+(im?'<img src="'+esc(im)+'">':'<div style="width:60px;height:60px;background:#171d26;border-radius:12px"></div>')+'<div class="grow"><b>'+esc(p.name||p.nombre||'Producto')+'</b><div style="color:#f0b90b;margin-top:4px">$ '+price.toFixed(2)+'</div><div class="qty"><button data-id="'+escAttr(x.id)+'" onclick="changeQty(this.dataset.id,-1)">−</button><b>'+x.qty+'</b><button data-id="'+escAttr(x.id)+'" onclick="changeQty(this.dataset.id,1)">+</button></div></div></div>'}).join('');document.getElementById('cartTotal').textContent='$ '+total.toFixed(2)}
function changeQty(id,d){let x=cart.find(x=>String(x.id)===String(id));if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(y=>String(y.id)!==String(id));renderCart()}
function sendOrder(){if(!cart.length)return;let phone=(config.whatsapp||document.body.dataset.whatsapp||'').replace(/\D/g,'');if(!phone){alert('Configura el WhatsApp de la tienda.');return}let lines=cart.map(x=>'- '+(x.p.name||x.p.nombre)+' x'+x.qty).join('\n');let total=cart.reduce((a,x)=>a+Number(x.p.price??x.p.precio??0)*x.qty,0);let msg='Hola, quiero realizar este pedido:\n\n'+lines+'\n\nTotal estimado: $ '+total.toFixed(2);location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(msg)}
function whatsapp(){let phone=(config.whatsapp||'').replace(/\D/g,'');if(!phone){alert('Configura el WhatsApp de la tienda.');return}location.href='https://wa.me/'+phone+'?text='+encodeURIComponent('Hola, necesito información sobre la tienda.')}
function shareStore(){if(navigator.share)navigator.share({title:config.store_name||'SINTHETIX PRO',url:location.href});else if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('Enlace copiado'))}
function rotateBanners(){if(!banners.length)return;let i=0;const hero=document.getElementById('hero');function go(){let b=banners[i++%banners.length];document.getElementById('heroTitle').textContent=b.title||'Descubre nuestros productos';document.getElementById('heroSub').textContent=b.subtitle||'Compra fácil y consulta por WhatsApp.';if(b.image_url)hero.style.backgroundImage='url('+JSON.stringify(b.image_url)+')'}go();setInterval(go,5000)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(v){return String(v??'').replaceAll("'",'').replaceAll('\\','')}load();</script></body></html>
