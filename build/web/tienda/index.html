<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#4A176B">
<title>Tienda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4A176B;
  --primary-2:#7C3AED;
  --primary-grad:linear-gradient(135deg,#4A176B 0%,#7C3AED 100%);
  --accent:#F0B90B;
  --bg:#FFFFFF;
  --bg-2:#F7F8FA;
  --card:#FFFFFF;
  --text:#0F172A;
  --muted:#64748B;
  --border:#E5E7EB;
  --shadow-lg:0 20px 50px rgba(0,0,0,.12);
}
[data-theme="dark"]{
  --bg:#0B0E13;
  --bg-2:#151A22;
  --card:#151A22;
  --text:#F5F7FA;
  --muted:#94A3B8;
  --border:#232A35;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;transition:background .3s,color .3s;padding-bottom:80px}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}

/* ============ HEADER ============ */
.header{position:sticky;top:0;z-index:100;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.header-inner{max-width:1400px;margin:0 auto}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.greeting{flex:1;min-width:0}
.greeting small{color:var(--muted);font-size:12px;font-weight:500;display:block}
.greeting h1{font-size:20px;font-weight:900;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--bg-2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s;position:relative}
.icon-btn:active{transform:scale(.94)}
.icon-btn:hover{background:var(--primary);color:#fff}
.cart-count{position:absolute;top:-3px;right:-3px;background:var(--accent);color:#111;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

/* ============ SEARCH ============ */
.search-bar{position:relative}
.search-bar input{width:100%;height:48px;padding:0 46px 0 18px;border:1.5px solid var(--border);border-radius:16px;font-size:14px;background:var(--bg-2);color:var(--text);outline:none;transition:.2s}
.search-bar input:focus{border-color:var(--primary);background:var(--bg)}
.search-bar input::placeholder{color:var(--muted)}
.search-bar i{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none}

/* ============ CARRUSEL ============ */
.carousel-wrap{margin:0 16px 20px;position:relative;border-radius:22px;overflow:hidden}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;height:280px;background:var(--primary-grad);position:relative;display:flex;align-items:center;padding:32px;color:#fff;overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 60%);z-index:1}
.slide-content{position:relative;z-index:2;max-width:520px}
.slide-eyebrow{display:inline-block;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:1.5px;margin-bottom:14px;text-transform:uppercase;backdrop-filter:blur(8px)}
.slide h2{font-size:28px;font-weight:900;line-height:1.1;margin-bottom:10px;letter-spacing:-.7px}
.slide p{font-size:14px;opacity:.92;margin-bottom:18px;line-height:1.5}
.slide-cta{display:flex;gap:10px}
.btn-slide{background:#fff;color:var(--primary);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:.2s}
.btn-slide:hover{transform:translateY(-2px)}
.slide-img{position:absolute;inset:0;z-index:0}
.slide-img img{width:100%;height:100%;object-fit:cover}
.carousel-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:.2s}
.dot.active{background:#fff;width:20px;border-radius:4px}
.carousel-btn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;display:none;align-items:center;justify-content:center;font-size:14px;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.carousel-btn:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
.carousel-btn.prev{left:14px}
.carousel-btn.next{right:14px}

/* ============ CATEGORÍAS ============ */
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:12px}
.section-head h3{font-size:17px;font-weight:900;letter-spacing:-.3px}
.section-head a{color:var(--primary);font-size:12px;font-weight:700;text-decoration:none}
.categories{display:flex;gap:10px;overflow-x:auto;padding:0 16px 20px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat-chip{padding:10px 18px;background:var(--bg-2);color:var(--text);border-radius:14px;font-size:13px;font-weight:700;white-space:nowrap;transition:.2s;border:1.5px solid transparent;display:flex;align-items:center;gap:8px}
.cat-chip i{font-size:14px;color:var(--primary)}
.cat-chip.active{background:var(--primary-grad);color:#fff}
.cat-chip.active i{color:#fff}
.cat-chip:hover{border-color:var(--primary)}

/* ============ PRODUCTOS ============ */
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 30px}
.product{background:var(--card);border-radius:18px;overflow:hidden;transition:.3s;cursor:pointer;border:1px solid var(--border)}
.product:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:transparent}
.product-img{aspect-ratio:1/1;background:var(--bg-2);position:relative;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover;transition:.5s}
.product:hover .product-img img{transform:scale(1.06)}
.product-fav{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;backdrop-filter:blur(8px);transition:.2s}
.product-fav.on{color:#EF4444}
.product-fav:hover{transform:scale(1.1)}
.product-info{padding:12px}
.product-name{font-size:13px;font-weight:700;line-height:1.35;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.product-price{font-size:16px;font-weight:900;color:var(--primary);margin-bottom:10px}
.product-btn{width:100%;padding:10px;background:var(--text);color:var(--bg);border-radius:11px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.product-btn:hover{background:var(--primary-grad);color:#fff}
.product-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}

/* ============ BOTTOM NAV ============ */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:90}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:700;background:none;border:0}
.nav-item i{font-size:19px}
.nav-item.active{color:var(--primary)}

/* ============ DRAWER ============ */
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.drawer.open{display:flex}
.drawer-sheet{background:var(--card);width:100%;max-height:88vh;border-radius:24px 24px 0 0;padding:20px;overflow-y:auto;animation:slideUp .3s;padding-bottom:max(20px,env(safe-area-inset-bottom))}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer-head h3{font-size:18px;font-weight:900}
.close-btn{width:36px;height:36px;border-radius:10px;background:var(--bg-2);font-size:14px;display:flex;align-items:center;justify-content:center}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.cart-item img,.cart-item .no-img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cart-item-info{flex:1;min-width:0}
.cart-item-info b{font-size:13px;font-weight:800;display:block;margin-bottom:4px}
.cart-item-price{color:var(--primary);font-weight:900;font-size:13px}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-btn{width:28px;height:28px;border:1.5px solid var(--border);border-radius:8px;font-weight:900;color:var(--primary);font-size:13px;display:flex;align-items:center;justify-content:center}
.qty-num{font-weight:900;min-width:22px;text-align:center}
.cart-total{font-size:20px;font-weight:900;text-align:right;margin-top:16px}
.checkout-btn{width:100%;padding:14px;background:#25D366;color:#fff;border-radius:14px;font-size:14px;font-weight:900;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty i{font-size:42px;color:var(--border);margin-bottom:12px;display:block}

/* ============ MODAL ============ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(6px)}
.modal.open{display:flex}
.modal-content{background:var(--card);width:100%;max-height:90vh;border-radius:24px 24px 0 0;overflow-y:auto;animation:slideUp .3s;padding-bottom:max(20px,env(safe-area-inset-bottom));position:relative}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--text);font-size:14px;z-index:2;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.modal-img{aspect-ratio:1/1;background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:52px}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-info{padding:20px}
.modal-info h2{font-size:21px;font-weight:900;margin-bottom:8px;line-height:1.2}
.modal-price{font-size:26px;font-weight:900;color:var(--primary);margin-bottom:14px}
.modal-desc{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px}
.modal-meta{display:flex;gap:14px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:16px}
.modal-meta span{font-size:12px;color:var(--muted)}
.modal-meta strong{color:var(--text);margin-right:4px}
.modal-actions{display:flex;gap:10px}
.modal-btn{flex:1;padding:14px;background:var(--primary-grad);color:#fff;border-radius:14px;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.modal-btn:disabled{background:var(--border);color:var(--muted)}
.share-btn{padding:14px 18px;background:var(--bg-2);border-radius:14px;font-size:16px;display:flex;align-items:center;justify-content:center}

/* ============ SIDEBAR ============ */
.sidebar{position:fixed;top:0;left:0;width:300px;height:100vh;background:var(--card);z-index:300;transform:translateX(-100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.sidebar.open{transform:translateX(0)}
.sidebar-head{padding:22px;background:var(--primary-grad);color:#fff}
.sidebar-head h2{font-size:17px;font-weight:900;line-height:1.1}
.sidebar-head p{font-size:11px;opacity:.85;margin-top:3px}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 10px}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:13px 14px;color:var(--text);text-decoration:none;border-radius:12px;font-size:13px;font-weight:600;transition:.2s;margin-bottom:2px}
.sidebar-nav a:hover{background:var(--bg-2);color:var(--primary)}
.sidebar-nav a i{font-size:16px;color:var(--primary);width:20px;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:250;opacity:0;visibility:hidden;transition:.3s}
.overlay.open{opacity:1;visibility:visible}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:14px;font-size:12px;font-weight:700;box-shadow:var(--shadow-lg);z-index:600;transition:transform .3s;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast i{color:#20C997}

/* ============ DESKTOP ============ */
@media(min-width:768px){
  body{padding-bottom:0}
  .bottom-nav{display:none}
  .header{padding:24px 40px 16px}
  .header-top{gap:20px;margin-bottom:16px}
  .greeting small{font-size:13px}
  .greeting h1{font-size:26px}
  .icon-btn{width:46px;height:46px;font-size:17px}
  .search-bar input{height:54px;font-size:15px;padding:0 54px 0 22px;border-radius:18px}
  .search-bar i{font-size:17px;right:22px}
  
  .carousel-wrap{margin:0 auto 32px;max-width:1400px;border-radius:28px}
  .slide{height:400px;padding:64px}
  .slide h2{font-size:52px}
  .slide p{font-size:16px}
  .btn-slide{padding:14px 28px;font-size:14px}
  .carousel-btn{display:flex}
  .carousel-dots{bottom:20px}
  .dot{width:10px;height:10px}
  
  .section-head{max-width:1400px;margin:0 auto 16px;padding:0 40px}
  .section-head h3{font-size:22px}
  .section-head a{font-size:13px}
  
  .categories{max-width:1400px;margin:0 auto;padding:0 40px 32px;justify-content:flex-start;flex-wrap:wrap;overflow:visible}
  .cat-chip{padding:12px 22px;font-size:14px}
  
  .products{max-width:1400px;margin:0 auto;grid-template-columns:repeat(3,1fr);padding:0 40px 70px;gap:24px}
  .product-info{padding:16px}
  .product-name{font-size:15px;min-height:42px}
  .product-price{font-size:20px;margin-bottom:14px}
  .product-btn{padding:13px;font-size:13px;border-radius:12px}
  .product-fav{width:40px;height:40px;font-size:16px;top:12px;right:12px}
  
  .modal{align-items:center;justify-content:center;padding:32px}
  .modal-content{max-width:900px;border-radius:24px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;max-height:85vh}
  .modal-img{aspect-ratio:auto;min-height:100%}
  .modal-info{padding:44px;display:flex;flex-direction:column;justify-content:center}
  .modal-info h2{font-size:30px}
  .modal-price{font-size:36px}
  .modal-desc{font-size:14px}
  
  .drawer{align-items:center;justify-content:center}
  .drawer-sheet{max-width:600px;border-radius:24px;max-height:80vh;padding:32px}
  .drawer-head h3{font-size:22px}
  .cart-item img,.cart-item .no-img{width:80px;height:80px}
  .cart-total{font-size:26px}
  .checkout-btn{padding:18px;font-size:15px}
  
  .toast{bottom:32px;font-size:13px;padding:14px 24px}
}

@media(min-width:1200px){
  .products{grid-template-columns:repeat(4,1fr);gap:28px}
  .slide{height:440px;padding:80px}
  .slide h2{font-size:60px}
  .header{padding:28px 48px 20px}
  .section-head{padding:0 48px}
  .categories{padding:0 48px 36px}
  .products{padding:0 48px 90px}
  .carousel-wrap{border-radius:32px}
}

.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px;grid-column:1/-1}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

const headers={"apikey":SUPA.key,"Authorization":"Bearer "+SUPA.key};
let products=[],categories=[],config={},banners=[],cart=[],cat="Todas",onlyFavs=false,currentSlide=0;

async function api(path){const r=await fetch(SUPA.url+"/rest/v1/"+path,{headers});if(!r.ok)throw new Error(await r.text());return r.json()}

async function load(){
try{
[config,categories,products,banners]=await Promise.all([
api("store_config?select=*&limit=1"),
api("store_categories?select=*&active=eq.true&order=name.asc"),
api("store_products?select=*&active=eq.true&order=created_at.desc"),
api("store_banners?select=*&active=eq.true&order=sort_order.asc").catch(()=>[])
]);
config=config[0]||{};
applyConfig();
renderCarousel();
renderChips();
renderProducts();
initTheme();
initCarousel();
}catch(e){
document.getElementById("content").innerHTML='<div class="empty"><i class="fa-solid fa-inbox"></i>No hay catálogo publicado todavía</div>';
console.error(e);
}
}

function applyConfig(){
const name=config.store_name||"Tienda";
document.getElementById("storeName").textContent=name;
document.getElementById("sidebarName").textContent=name;
if(config.primary_color){
const c=config.primary_color;
document.documentElement.style.setProperty('--primary',c);
const dark=adjustColor(c,-25);
document.documentElement.style.setProperty('--primary-2',dark);
document.documentElement.style.setProperty('--primary-grad','linear-gradient(135deg,'+c+' 0%,'+dark+' 100%)');
document.querySelector('meta[name=theme-color]').setAttribute('content',c);
}
document.title=name;
}

function adjustColor(hex,percent){
let c=hex.replace('#','');
if(c.length===3)c=c.split('').map(x=>x+x).join('');
const num=parseInt(c,16);
let r=Math.max(0,Math.min(255,(num>>16)+percent));
let g=Math.max(0,Math.min(255,((num>>8)&0x00FF)+percent));
let b=Math.max(0,Math.min(255,(num&0x0000FF)+percent));
return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function renderCarousel(){
const el=document.getElementById("carousel");
const dots=document.getElementById("carouselDots");
const fallback=[{
title:"Descubre nuestros productos",
subtitle:config.description||"Compra fácil y consulta por WhatsApp.",
image_url:null,
button_text:"Ver catálogo"
}];
const slides=banners.length?banners:fallback;
el.innerHTML=slides.map(b=>{
const img=b.image_url||"";
const bg=img?`<div class="slide-img"><img src="${esc(img)}" onerror="this.style.display='none'"></div>`:"";
return `<div class="slide">
${bg}
<div class="slide-content">
<div class="slide-eyebrow">Nueva colección</div>
<h2>${esc(b.title||"Bienvenido")}</h2>
<p>${esc(b.subtitle||config.description||"Descubre nuestra selección")}</p>
<div class="slide-cta">
<a href="#catalogo" class="btn-slide"><i class="fa-solid fa-bag-shopping"></i> ${esc(b.button_text||"Ver catálogo")}</a>
<button class="btn-slide" style="background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.25);backdrop-filter:blur(8px)" onclick="whatsapp()"><i class="fa-brands fa-whatsapp"></i></button>
</div>
</div>
</div>`;
}).join("");
if(slides.length>1){
dots.innerHTML=slides.map((_,i)=>`<div class="dot ${i===0?"active":""}" onclick="goToSlide(${i})"></div>`).join("");
}else{
dots.innerHTML="";
}
currentSlide=0;
}

function initCarousel(){
const el=document.getElementById("carousel");
if(!el)return;
el.addEventListener("scroll",()=>{
const w=el.clientWidth;
const idx=Math.round(el.scrollLeft/w);
if(idx!==currentSlide){
currentSlide=idx;
updateDots();
}
},{passive:true});
// Auto-rotar cada 6s
setInterval(()=>{
const slides=document.querySelectorAll(".slide");
if(slides.length<2)return;
currentSlide=(currentSlide+1)%slides.length;
goToSlide(currentSlide);
},6000);
}

function goToSlide(i){
const el=document.getElementById("carousel");
if(!el)return;
el.scrollTo({left:i*el.clientWidth,behavior:"smooth"});
currentSlide=i;
updateDots();
}

function updateDots(){
document.querySelectorAll(".dot").forEach((d,i)=>d.classList.toggle("active",i===currentSlide));
}

function prevSlide(){goToSlide(Math.max(0,currentSlide-1));}
function nextSlide(){
const total=document.querySelectorAll(".slide").length;
goToSlide(Math.min(total-1,currentSlide+1));
}

function initTheme(){
const saved=localStorage.getItem("theme")||"light";
document.documentElement.setAttribute("data-theme",saved);
updateThemeIcon(saved);
}

function toggleTheme(){
const cur=document.documentElement.getAttribute("data-theme")||"light";
const next=cur==="light"?"dark":"light";
document.documentElement.setAttribute("data-theme",next);
localStorage.setItem("theme",next);
updateThemeIcon(next);
}

function updateThemeIcon(theme){
document.querySelector("#themeBtn i").className=theme==="dark"?"fa-solid fa-sun":"fa-solid fa-moon";
}

function openSidebar(){document.getElementById("sidebar").classList.add("open");document.getElementById("overlay").classList.add("open");}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("overlay").classList.remove("open");}

function getCatIcon(name){
const n=name.toLowerCase();
if(n.includes("ropa")||n.includes("cloth"))return "fa-shirt";
if(n.includes("calz")||n.includes("shoe"))return "fa-shoe-prints";
if(n.includes("acces"))return "fa-glasses";
if(n.includes("comida")||n.includes("food")||n.includes("ali"))return "fa-utensils";
if(n.includes("electron"))return "fa-laptop";
if(n.includes("juguete")||n.includes("toy"))return "fa-gamepad";
if(n.includes("belle")||n.includes("cosme"))return "fa-spa";
if(n.includes("salud"))return "fa-heart-pulse";
if(n.includes("libro")||n.includes("book"))return "fa-book";
if(n.includes("mascot")||n.includes("pet"))return "fa-paw";
if(n.includes("hogar")||n.includes("home"))return "fa-couch";
if(n.includes("dildo")||n.includes("sex")||n.includes("intim"))return "fa-heart";
if(n.includes("general"))return "fa-tag";
return "fa-folder";
}

function renderChips(){
const names=["Todas",...categories.map(c=>c.name)];
document.getElementById("chips").innerHTML=names.map(n=>{
const icon=n==="Todas"?"fa-bag-shopping":getCatIcon(n);
const active=n===cat&&!onlyFavs;
return `<button class="cat-chip ${active?"active":""}" onclick="selectCat('${esc(n)}',this)"><i class="fa-solid ${icon}"></i>${esc(n)}</button>`;
}).join("");
}

function selectCat(n,el){
cat=n;onlyFavs=false;
document.querySelectorAll(".cat-chip").forEach(c=>c.classList.remove("active"));
if(el)el.classList.add("active");
renderProducts();
}

function showFavs(){
onlyFavs=true;cat="Todas";
document.querySelectorAll(".cat-chip").forEach(c=>c.classList.remove("active"));
renderProducts();
}

function showAll(){
cat="Todas";onlyFavs=false;
document.querySelectorAll(".cat-chip").forEach((c,i)=>c.classList.toggle("active",i===0));
renderProducts();
}

function getImg(p){return p.image_url||p.imagen_url||"";}
function getId(p){return p.id||p.local_id;}

function renderProducts(){
const q=document.getElementById("search").value.trim().toLowerCase();
const catId=categories.find(c=>c.name===cat)?.id;
const list=products.filter(p=>{
const id=getId(p);
const favOk=!onlyFavs||localStorage.getItem("fav_"+id)==="1";
const catOk=onlyFavs||cat==="Todas"||String(p.category_id||"")===String(catId||"")||String(p.categoria||"")===cat;
const searchOk=!q||String(p.name||p.nombre||"").toLowerCase().includes(q)||String(p.barcode||"").toLowerCase().includes(q)||String(p.brand||"").toLowerCase().includes(q);
return favOk&&catOk&&searchOk;
});
if(!list.length){
document.getElementById("content").innerHTML=`<div class="empty"><i class="fa-solid fa-${onlyFavs?"heart":"magnifying-glass"}"></i>${onlyFavs?"No tienes favoritos":"No hay productos"}</div>`;
return;
}
document.getElementById("content").innerHTML=list.map(p=>card(p)).join("");
}

function card(p){
const id=getId(p);
const name=p.name||p.nombre||"Producto";
const price=Number(p.price||p.precio||0);
const stock=Number(p.stock||0);
const im=getImg(p);
const fav=localStorage.getItem("fav_"+id)==="1";
return `<article class="product" onclick="openModal('${esc(id)}')">
<div class="product-img">
${im?`<img loading="lazy" src="${esc(im)}">`:'<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#ccc"><i class="fa-solid fa-image" style="font-size:40px"></i></div>'}
<button class="product-fav ${fav?"on":""}" onclick="event.stopPropagation();toggleFav('${esc(id)}',this)"><i class="fa-${fav?"solid":"regular"} fa-heart"></i></button>
</div>
<div class="product-info">
<h3 class="product-name">${esc(name)}</h3>
<div class="product-price">$${price.toFixed(2)}</div>
<button class="product-btn" ${stock<=0?"disabled":""} onclick="event.stopPropagation();add('${esc(id)}')">
<i class="fa-solid fa-cart-plus"></i> ${stock<=0?"Agotado":"Agregar"}
</button>
</div>
</article>`;
}

function toggleFav(id,btn){
const on=localStorage.getItem("fav_"+id)==="1";
localStorage.setItem("fav_"+id,on?"0":"1");
btn.classList.toggle("on",!on);
btn.innerHTML=`<i class="fa-${!on?"solid":"regular"} fa-heart"></i>`;
showToast(on?"Quitado":"Agregado a favoritos");
}

function openModal(id){
const p=products.find(x=>String(getId(x))===String(id));
if(!p)return;
const name=p.name||p.nombre||"Producto";
const price=Number(p.price||p.precio||0);
const stock=Number(p.stock||0);
const im=getImg(p);
const desc=p.description||p.descripcion||"Producto disponible en nuestra tienda.";
const brand=p.brand||p.marca||"—";
document.getElementById("modalBody").innerHTML=`
<div class="modal-img">${im?`<img src="${esc(im)}">`:'<i class="fa-solid fa-image"></i>'}</div>
<div class="modal-info">
<h2>${esc(name)}</h2>
<div class="modal-price">$${price.toFixed(2)}</div>
<p class="modal-desc">${esc(desc)}</p>
<div class="modal-meta">
<span><strong>Marca:</strong> ${esc(brand)}</span>
<span><strong>Stock:</strong> ${stock>0?stock:"Agotado"}</span>
</div>
<div class="modal-actions">
<button class="modal-btn" ${stock<=0?"disabled":""} onclick="add('${esc(id)}');closeModal();">
<i class="fa-solid fa-cart-plus"></i> ${stock<=0?"Agotado":"Agregar al carrito"}
</button>
<button class="share-btn" onclick="shareProduct('${esc(id)}')"><i class="fa-solid fa-share-nodes"></i></button>
</div>
</div>`;
document.getElementById("productModal").classList.add("open");
document.body.style.overflow="hidden";
}

function closeModal(){document.getElementById("productModal").classList.remove("open");document.body.style.overflow="";}

function add(id){
const p=products.find(x=>String(getId(x))===String(id));
if(!p)return;
const x=cart.find(c=>String(c.id)===String(id));
if(x)x.qty++;
else cart.push({id,p,qty:1});
updateCartCount();
showToast("Agregado al carrito");
openCart();
}

function updateCartCount(){
document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
}

function openCart(){renderCart();document.getElementById("drawer").classList.add("open");document.body.style.overflow="hidden";}
function closeCart(){document.getElementById("drawer").classList.remove("open");document.body.style.overflow="";}

function renderCart(){
const el=document.getElementById("cart");
if(!cart.length){el.innerHTML='<div class="empty"><i class="fa-solid fa-bag-shopping"></i>Tu carrito está vacío</div>';document.getElementById("cartTotal").textContent="";return;}
let total=0;
el.innerHTML=cart.map(x=>{
const p=x.p;
const price=Number(p.price||p.precio||0);
total+=price*x.qty;
const im=getImg(p);
return `<div class="cart-item">
${im?`<img src="${esc(im)}">`:'<div class="no-img"><i class="fa-solid fa-image"></i></div>'}
<div class="cart-item-info">
<b>${esc(p.name||p.nombre||"Producto")}</b>
<div class="cart-item-price">$${price.toFixed(2)}</div>
<div class="qty-row">
<button class="qty-btn" onclick="changeQty('${esc(x.id)}',-1)">−</button>
<span class="qty-num">${x.qty}</span>
<button class="qty-btn" onclick="changeQty('${esc(x.id)}',1)">+</button>
</div>
</div>
</div>`;
}).join("");
document.getElementById("cartTotal").textContent="Total: $"+total.toFixed(2);
}

function changeQty(id,d){
const x=cart.find(c=>String(c.id)===String(id));
if(!x)return;
x.qty+=d;
if(x.qty<=0)cart=cart.filter(c=>String(c.id)!==String(id));
renderCart();updateCartCount();
}

function sendOrder(){
if(!cart.length)return;
const phone=(config.whatsapp||"").replace(/\D/g,"");
if(!phone){alert("Configura el WhatsApp de la tienda.");return;}
const lines=cart.map(x=>"• "+(x.p.name||x.p.nombre)+" x"+x.qty+" = $"+(Number(x.p.price||x.p.precio||0)*x.qty).toFixed(2)).join("\n");
const total=cart.reduce((s,x)=>s+Number(x.p.price||x.p.precio||0)*x.qty,0);
const msg="🛍️ NUEVO PEDIDO\n\n"+lines+"\n\n💰 Total: $"+total.toFixed(2)+"\n\nConfírmenme disponibilidad.";
location.href="https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
}

function whatsapp(){
const phone=(config.whatsapp||"").replace(/\D/g,"");
if(!phone){alert("Configura el WhatsApp de la tienda.");return;}
location.href="https://wa.me/"+phone+"?text="+encodeURIComponent("Hola, necesito información sobre los productos.");
}

async function shareStore(){
const url=location.href;
const title=config.store_name||"Tienda";
if(navigator.share){try{await navigator.share({title,text:"Visita nuestra tienda",url});}catch(e){}}
else if(navigator.clipboard){await navigator.clipboard.writeText(url);showToast("Enlace copiado");}
}

async function shareProduct(id){
const p=products.find(x=>String(getId(x))===String(id));
if(!p)return;
const name=p.name||p.nombre||"Producto";
const price=Number(p.price||p.precio||0);
const url=location.href.split("#")[0]+"#p-"+id;
const text=name+" - $"+price.toFixed(2);
if(navigator.share){try{await navigator.share({title:name,text,url});}catch(e){}}
else if(navigator.clipboard){await navigator.clipboard.writeText(text+"\n"+url);showToast("Enlace copiado");}
}

function showToast(msg){
const t=document.getElementById("toast");
document.getElementById("toastText").textContent=msg;
t.classList.add("show");
clearTimeout(window._toast);
window._toast=setTimeout(()=>t.classList.remove("show"),2000);
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeCart();closeSidebar();}});

load();
</script>

</body>
</html>
