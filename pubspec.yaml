name: tu_app
description: SINTHETIX PRO

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # ============ UTILIDADES BÁSICAS ============
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  supabase_flutter: ^2.16.0
  curved_labeled_navigation_bar: ^2.0.6
  audioplayers: ^6.8.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.1
  
  # ============ IMPRESIÓN TÉRMICA ============
  blue_thermal_printer: ^1.2.3
  esc_pos_utils: ^1.1.0
  flutter_esc_pos_network: ^0.0.1
  
  # ============ GRÁFICOS Y QR ============
  fl_chart: ^0.66.0
  qr_flutter: ^4.1.0
  
  # ============ EXPORTACIÓN ============
  # SOLO pdf, SIN printing (para evitar conflicto con esc_pos_utils)
  pdf: ^3.8.4
  
  # ============ VOZ ============
  speech_to_text: ^6.6.0
  
  # ============ ESCÁNER ============
  mobile_scanner: ^5.0.0
  image_picker: ^1.0.0
  
  # ============ OTROS ============
  intl: ^0.19.0
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
    - assets/imagen/